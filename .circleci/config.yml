version: 2.1

executors:
  xcode:
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium

commands:
  check_cache_env:
    steps:
      - run:
          name: Check cache env vars
          command: |
            env | grep -E 'COMPILATION_CACHE|SWIFT_ENABLE' || echo "no cache env vars set"

  check_cache_socket:
    steps:
      - run:
          name: Check cache server socket + process
          command: |
            sock="${COMPILATION_CACHE_REMOTE_SERVICE_PATH#unix://}"
            echo "Expected socket: $sock"
            ls -la "$(dirname "$sock")" || echo "cannot list socket dir"
            echo "---"
            ps aux | grep -E 'cache server|circleci run cache' | grep -v grep || echo "no cache-server process found"
            echo "---"
            if command -v nc >/dev/null 2>&1; then
              if nc -z -U "$sock" 2>&1; then
                echo "socket connect (nc): SUCCESS"
              else
                echo "socket connect (nc): FAILED (exit $?)"
              fi
            else
              echo "socket connect (nc): nc not available, skipped"
            fi
            echo "---"
            python3 -c "
            import socket
            s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
            try:
                s.settimeout(3)
                s.connect('$sock')
                print('socket connect (python): SUCCESS')
            except Exception as e:
                print(f'socket connect (python): FAILED ({e})')
            "

  check_sandbox_denials:
    steps:
      - run:
          name: Check for sandbox denials
          command: |
            sudo log show --last 3m \
              --predicate 'eventMessage contains "deny" and (eventMessage contains "connect" or eventMessage contains "unix" or eventMessage contains ".sock")' \
              --style compact \
              || echo "log show failed or found nothing"

  timed_build:
    parameters:
      step_name:
        type: string
      command:
        type: string
    steps:
      - run:
          name: << parameters.step_name >>
          command: |
            start=$(date +%s%N)
            << parameters.command >>
            end=$(date +%s%N)
            echo "export BUILD_NS=$((end - start))" >> "$BASH_ENV"

jobs:
  smoke-test-xcode-cache:
    executor: xcode
    steps:
      - checkout
      - run:
          name: List schemes (sanity check)
          command: xcodebuild -list -project Alamofire.xcodeproj
      - with_tool_cache:
          tool: xcode
          steps:
            - check_cache_env
            - check_cache_socket
            - run:
                name: Cold build
                command: |
                  sock="${COMPILATION_CACHE_REMOTE_SERVICE_PATH#unix://}"
                  xcodebuild build \
                    -project Alamofire.xcodeproj \
                    -scheme "Alamofire iOS" \
                    -destination 'generic/platform=iOS Simulator' \
                    COMPILATION_CACHE_REMOTE_SERVICE_PATH="$sock" \
                    COMPILATION_CACHE_ENABLE_PLUGIN=YES \
                    SWIFT_ENABLE_COMPILE_CACHE=YES \
                    CLANG_ENABLE_COMPILE_CACHE=YES \
                    SWIFT_ENABLE_EXPLICIT_MODULES=YES \
                    SWIFT_USE_INTEGRATED_DRIVER=YES \
                    CLANG_ENABLE_MODULES=YES \
                    COMPILATION_CACHE_ENABLE_INTEGRATED_QUERIES=YES \
                    COMPILATION_CACHE_ENABLE_DETACHED_KEY_QUERIES=YES
            - check_sandbox_denials
            - run:
                name: Clear local intermediates (force real cache query)
                command: |
                  # Deliberately NOT touching CompilationCache.noindex - only the
                  # local incremental-build state, so Xcode can't short-circuit
                  # via its own up-to-date check and skip asking the remote cache.
                  rm -rf ~/Library/Developer/Xcode/DerivedData/Alamofire-*/Build/Intermediates.noindex
            - run:
                name: Rebuild (expect cache hits)
                command: |
                  sock="${COMPILATION_CACHE_REMOTE_SERVICE_PATH#unix://}"
                  xcodebuild build \
                    -project Alamofire.xcodeproj \
                    -scheme "Alamofire iOS" \
                    -destination 'generic/platform=iOS Simulator' \
                    COMPILATION_CACHE_REMOTE_SERVICE_PATH="$sock" \
                    COMPILATION_CACHE_ENABLE_PLUGIN=YES \
                    SWIFT_ENABLE_COMPILE_CACHE=YES \
                    CLANG_ENABLE_COMPILE_CACHE=YES \
                    SWIFT_ENABLE_EXPLICIT_MODULES=YES \
                    SWIFT_USE_INTEGRATED_DRIVER=YES \
                    CLANG_ENABLE_MODULES=YES \
                    COMPILATION_CACHE_ENABLE_INTEGRATED_QUERIES=YES \
                    COMPILATION_CACHE_ENABLE_DETACHED_KEY_QUERIES=YES

  seed-xcode:
    executor: xcode
    steps:
      - checkout
      - with_tool_cache:
          tool: xcode
          steps:
            - check_cache_env
            - check_cache_socket
            - run:
                name: Seed build
                command: |
                  sock="${COMPILATION_CACHE_REMOTE_SERVICE_PATH#unix://}"
                  xcodebuild build \
                    -project Alamofire.xcodeproj \
                    -scheme "Alamofire iOS" \
                    -destination 'generic/platform=iOS Simulator' \
                    COMPILATION_CACHE_REMOTE_SERVICE_PATH="$sock" \
                    COMPILATION_CACHE_ENABLE_PLUGIN=YES \
                    SWIFT_ENABLE_COMPILE_CACHE=YES \
                    CLANG_ENABLE_COMPILE_CACHE=YES \
                    SWIFT_ENABLE_EXPLICIT_MODULES=YES \
                    SWIFT_USE_INTEGRATED_DRIVER=YES \
                    CLANG_ENABLE_MODULES=YES \
                    COMPILATION_CACHE_ENABLE_INTEGRATED_QUERIES=YES \
                    COMPILATION_CACHE_ENABLE_DETACHED_KEY_QUERIES=YES
      - save_cache:
          key: xcode-bench-{{ .Environment.CIRCLE_BUILD_NUM }}
          paths:
            # TODO: still need to confirm what with_tool_cache actually
            # populates for Xcode — this is a guess
            - ~/Library/Developer/Xcode/DerivedData
            - ~/Library/Caches/org.llvm.clang

  benchmark-xcode:
    executor: xcode
    parameters:
      use_cache_subcommand:
        type: boolean
      use_circleci_cache:
        type: boolean
        default: false
    steps:
      - checkout
      - unless:
          condition: << parameters.use_cache_subcommand >>
          steps:
            - when:
                condition: << parameters.use_circleci_cache >>
                steps:
                  - restore_cache:
                      keys:
                        - xcode-bench-
            - unless:
                condition: << parameters.use_circleci_cache >>
                steps:
                  - run:
                      name: Clean DerivedData (no-cache baseline)
                      command: rm -rf ~/Library/Developer/Xcode/DerivedData
      - run:
          name: Record variant name
          command: |
            variant="<<# parameters.use_cache_subcommand >>cache-server<</ parameters.use_cache_subcommand >><<^ parameters.use_cache_subcommand >><<# parameters.use_circleci_cache >>circleci-cache<</ parameters.use_circleci_cache >><<^ parameters.use_circleci_cache >>no-cache<</ parameters.use_circleci_cache >><</ parameters.use_cache_subcommand >>"
            echo "export BENCH_VARIANT=$variant" >> "$BASH_ENV"
      - when:
          condition: << parameters.use_cache_subcommand >>
          steps:
            - with_tool_cache:
                tool: xcode
                steps:
                  - check_cache_env
                  - check_cache_socket
                  - timed_build:
                      step_name: xcodebuild build
                      command: |
                        sock="${COMPILATION_CACHE_REMOTE_SERVICE_PATH#unix://}"
                        xcodebuild build \
                          -project Alamofire.xcodeproj \
                          -scheme "Alamofire iOS" \
                          -destination 'generic/platform=iOS Simulator' \
                          COMPILATION_CACHE_REMOTE_SERVICE_PATH="$sock" \
                          COMPILATION_CACHE_ENABLE_PLUGIN=YES \
                          SWIFT_ENABLE_COMPILE_CACHE=YES \
                          CLANG_ENABLE_COMPILE_CACHE=YES \
                          SWIFT_ENABLE_EXPLICIT_MODULES=YES \
                          SWIFT_USE_INTEGRATED_DRIVER=YES \
                          CLANG_ENABLE_MODULES=YES \
                          COMPILATION_CACHE_ENABLE_INTEGRATED_QUERIES=YES \
                          COMPILATION_CACHE_ENABLE_DETACHED_KEY_QUERIES=YES
      - unless:
          condition: << parameters.use_cache_subcommand >>
          steps:
            - timed_build:
                step_name: xcodebuild build
                command: |
                  xcodebuild build \
                    -project Alamofire.xcodeproj \
                    -scheme "Alamofire iOS" \
                    -destination 'generic/platform=iOS Simulator'
      - run:
          name: Record result
          when: always
          command: |
            mkdir -p /tmp/bench-results/xcode
            if [ -n "${BUILD_NS:-}" ]; then
              echo $((BUILD_NS / 1000000)) > /tmp/bench-results/xcode/$BENCH_VARIANT
            else
              echo FAILED > /tmp/bench-results/xcode/$BENCH_VARIANT
            fi
      - persist_to_workspace:
          when: always
          root: /tmp
          paths:
            - bench-results

workflows:
  xcode-cache-check:
    jobs:
      - smoke-test-xcode-cache
      - approve-benchmarks:
          type: approval
      - seed-xcode:
          requires:
            - approve-benchmarks
      - benchmark-xcode:
          name: Xcode - No caching
          use_cache_subcommand: false
          use_circleci_cache: false
          requires:
            - seed-xcode
      - benchmark-xcode:
          name: Xcode - Cache server
          use_cache_subcommand: true
          use_circleci_cache: false
          requires:
            - seed-xcode
      - benchmark-xcode:
          name: Xcode - CircleCI cache
          use_cache_subcommand: false
          use_circleci_cache: true
          requires:
            - seed-xcode
